# Deviations from the spec, verified against zensical 0.0.59:
#   search.suggest — not implemented. Zensical does not validate feature
#   names (config.py: features is checked only for list type), so it builds
#   clean regardless. Verified absent from all templates, the JS bundle, the
#   search worker, and zensical's own bootstrap/zensical.toml reference
#   config. Removed from `features` below. Re-test on version upgrade.
#   section-index — not implemented. The string "section-index" appears
#   nowhere in the installed package, and enabling
#   `[project.plugins.section-index]` built clean but every nav section
#   still rendered as a `<label>` toggle in the built HTML, not a link
#   (same "unknown key accepted silently" trap as search.suggest above).
#   Removed. Replaced with `navigation.indexes`, zensical's real equivalent
#   (present in its own bootstrap/zensical.toml reference config) — verified
#   working: after enabling it, a module section header renders as
#   `<a href=".../index.html">` in site/modules/index.html instead of a
#   bare `<label>`.
#   table-reader — not implemented. No such plugin, extension, or string
#   exists in the installed package. The spec (spec:32,59,225,343) claims
#   it renders decision matrices from CSV; in this build, matrices are
#   instead rendered by our own generator (tools/generate.py sync) into a
#   `<!-- generated:matrix -->` block, same mechanism as the other six
#   generated blocks. See spec:181-182 and spec:433, corrected accordingly.
#   tags plugin tag-index listing — IS implemented, but not via the
#   documented-looking `tags_file` key (that key raises a hard
#   ValueError: "is deprecated; use a material/tags listing directive").
#   The working mechanism is `listings = true` under
#   `[project.plugins.tags]` plus a literal `<!-- material/tags -->` HTML
#   comment embedded in a page (docs/tags.md). Verified by building and
#   inspecting site/tags/index.html (a real tag listing with per-tag
#   anchors) and a content page's tag chips, which now render as
#   `<a href="…/tags/#tag:…">` instead of inert `<span>` elements.

[project]
site_name        = "Engineering Playbook"
site_description = "Living architecture playbook: patterns, standards, decisions, checklists."
docs_dir         = "docs"
site_dir         = "site"
site_url  = "https://ryansyenyi.github.io/engineering-playbook/"
repo_url  = "https://github.com/ryansyenyi/engineering-playbook"
repo_name = "ryansyenyi/engineering-playbook"
edit_uri  = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
watch     = ["data", "tools"]

nav = [
  { "Playbook" = "index.md" },
  { "Principles" = [
    "principles/index.md",
    "principles/security-first.md",
    "principles/api-first.md",
    "principles/cloud-native.md",
    "principles/twelve-factor.md",
    "principles/multi-tenant-design.md",
    "principles/least-privilege.md",
    "principles/defense-in-depth.md",
    "principles/event-driven-architecture.md",
    "principles/domain-driven-design.md",
  ] },
  { "Modules" = [
    "modules/index.md",
    { "Authentication" = [
      "modules/authentication/index.md",
      "modules/authentication/email-password.md",
      "modules/authentication/magic-link.md",
      "modules/authentication/passkeys.md",
      "modules/authentication/social-login.md",
      "modules/authentication/enterprise-sso.md",
      "modules/authentication/oidc.md",
      "modules/authentication/oauth2.md",
      "modules/authentication/jwt.md",
      "modules/authentication/session-cookies.md",
      "modules/authentication/refresh-tokens.md",
    ] },
    "modules/authorization/index.md",
    "modules/multi-tenancy/index.md",
    "modules/api-design/index.md",
    "modules/database-design/index.md",
    "modules/networking/index.md",
    "modules/observability/index.md",
  ] },
  { "Security" = [
    "security/index.md",
    "security/password-storage.md",
    "security/session-security.md",
    "security/secrets-management.md",
    "security/encryption.md",
    "security/api-security.md",
    "security/oauth-security.md",
    "security/owasp-top-10.md",
    "security/audit-logging.md",
    "security/rate-limiting.md",
    "security/mfa.md",
    "security/sso.md",
    "security/secure-headers.md",
    "security/key-rotation.md",
    "security/backup-strategy.md",
    "security/incident-response.md",
  ] },
  { "Decisions" = [
    "decisions/index.md",
    "decisions/0001-argon2id-for-password-hashing.md",
  ] },
  { "Checklists" = [ "checklists/index.md", "checklists/authentication.md" ] },
  { "Matrices" = [
    "matrices/index.md",
    "matrices/password-hashing.md",
    "matrices/jwt-vs-session-cookies.md",
  ] },
  { "Tags" = "tags.md" },
  { "What's moving" = [
    "recently-updated.md",
    "changelog.md",
    "research-queue.md",
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

[project.plugins.search]
[project.plugins.tags]
listings = true

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Instant previews: hovering a link to a principle, module page, security page
# or decision matrix shows that page's opening content without navigating.
# The design makes principles individual pages specifically so they can be
# previewed this way, so the extension has to be enabled for that to hold.
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "principles/*",
  "modules/*",
  "security/*",
  "matrices/*",
  "decisions/*",
  "checklists/*",
]
